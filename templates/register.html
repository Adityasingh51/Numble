<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Numble Signup</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body, html {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background: url('https://images.unsplash.com/photo-1487700160041-babef9c3cb55?fm=jpg&q=60&w=3000&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8bWluaW1hbGlzdCUyMHdhbGxwYXBlcnxlbnwwfHwwfHx8MA%3D%3D') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .signup-container {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 450px;
      text-align: center;
    }

    .signup-container h2 {
      margin-bottom: 20px;
      font-weight: 600;
    }

    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      margin-bottom: 5px;
      font-weight: 500;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      outline: none;
    }

    .signup-btn {
      background-color: #4F46E5;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 16px;
      transition: background 0.3s ease;
    }

    .signup-btn:hover {
      background-color: #3730a3;
    }

    .social-login {
      margin: 20px 0;
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px;
      border-radius: 10px;
      width: 100%;
      border: none;
      cursor: pointer;
      font-weight: 500;
      font-size: 15px;
      margin-bottom: 10px;
    }

    .google-btn {
      background-color: #fff;
      border: 1px solid #ccc;
    }

    .facebook-btn {
      background-color: #1877f2;
      color: white;
    }

    .social-btn img {
      width: 20px;
      height: 20px;
    }

    .footer {
      margin-top: 20px;
      font-size: 13px;
      color: #666;
    }

    @media (max-width: 500px) {
      .signup-container {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

<div class="signup-container">
  <h2>Create your Numble account</h2>
  <p>
    {% if msg %}
        {{ msg | safe }}
    {% else %}
        Add your details
    {% endif %}                                     
</p> 
  <form method="post" action="">
    {% csrf_token %}
    <div class="input-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Enter your name" required />
      {{ form.name }}
    </div>
    <div class="input-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="Enter your email" required />
      {{ form.email }}
    </div>
    <div class="input-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Create a password" required />
      {{ form.password }}
    </div>

    <div class="input-group">
      <label for="confirm-password">Confirm Password</label>
      <input type="password" id="confirm-password" placeholder="Confirm your password" required />
    </div>
    <button type="submit" class="signup-btn">Sign Up</button>
  </form>

  <div class="social-login">
    <p>Or sign up with</p>
    <button class="social-btn google-btn">
      <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg" alt="Google icon">
      Google
    </button>
    <button class="social-btn facebook-btn">
      <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/facebook/facebook-original.svg" alt="Facebook icon">
      Facebook
    </button>
    <button class="social-btn Guest-btn">
    <a href="landing.html" style="color: #166406;">Continue as Guest</a>
    </button>
  </div>

  <div class="footer">
    Already have an account? <a href="login.html" style="color: #4F46E5;">Login</a>
  </div>
</div>

</body>
</html>
